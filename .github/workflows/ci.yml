name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Install Node dependencies (locked)
        run: npm ci

      - name: Install Functions dependencies (locked)
        run: npm --prefix functions ci

      - name: Matrix coverage, syntax checks and unit tests
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Functions contract tests
        run: npm run test:functions

      - name: Real browser apply and undo smoke
        run: npm run test:browser

      - name: Firestore security rules tests
        run: npm run test:firebase

      - name: Sponsored and individual licence lifecycle acceptance
        run: npm run test:lifecycle

      - name: Rules are freshly generated
        run: |
          python tools/generate-audit-rules.py
          git diff --exit-code -- audit-rules.js || {
            echo "::error::audit-rules.js is stale - run python tools/generate-audit-rules.py and commit the result"
            exit 1
          }

      - name: Build reproducible package
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: claim-autofill-extension.zip
