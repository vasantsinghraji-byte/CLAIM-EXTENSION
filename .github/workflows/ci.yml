name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Install Node dependencies (locked)
        run: npm ci

      - name: Install Functions dependencies (locked)
        run: npm --prefix functions ci

      - name: Matrix coverage, syntax checks and unit tests
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Functions contract tests
        run: npm run test:functions

      - name: Firestore security rules tests
        run: npm run test:firebase

      - name: Rules are freshly generated
        run: |
          python tools/generate-audit-rules.py
          git diff --exit-code -- audit-rules.js || {
            echo "::error::audit-rules.js is stale - run python tools/generate-audit-rules.py and commit the result"
            exit 1
          }

      - name: Build reproducible package
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: claim-autofill-extension.zip
